<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Stats</title>
</head>
<body>
    <h1>Your Spotify Stats</h1>
    <div id="top-tracks"></div>
    <div id="top-artists"></div>
    <script>
        // Change the REDIRECT_URI to the production URL
        const REDIRECT_URI = 'https://dreams5710.github.io/spotify-stats/';

        // Extract token from URL hash
        const hash = window.location.hash;
        const token = hash ? hash.split('&').find(elem => elem.startsWith('access_token'))?.split('=')[1] : null;

        // Fetch top tracks
        if (token) {
            Promise.all([
                fetch('https://api.spotify.com/v1/me/top/tracks', { headers: { 'Authorization': 'Bearer ' + token } }),
                fetch('https://api.spotify.com/v1/me/top/artists', { headers: { 'Authorization': 'Bearer ' + token } })
            ])
            .then(async ([tracksRes, artistsRes]) => {
                const tracks = await tracksRes.json();
                const artists = await artistsRes.json();
                document.getElementById('top-tracks').innerHTML = '<h2>Top Tracks</h2>' + tracks.items.map(track => `<p>${track.name} - ${track.artists.map(artist => artist.name).join(', ')}</p>`).join('');
                document.getElementById('top-artists').innerHTML = '<h2>Top Artists</h2>' + artists.items.map(artist => `<p>${artist.name}</p>`).join('');
            })
            .catch(err => console.error('Error fetching data:', err));
        } else {
            document.getElementById('top-tracks').innerHTML = '<p>No token found. Please log in.</p>';
        }
    </script>
</body>
</html>
